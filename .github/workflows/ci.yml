name: CI

# Every PR and every push to main: build (warnings are errors), unit tests, widget catalog validation.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: dotnet build Umbra.slnx -c Release -warnaserror
      - name: Unit tests
        run: dotnet test Umbra.slnx -c Release --no-build --logger "console;verbosity=normal"
      - name: Widget parser and SDK tests
        run: node --test tests/widgets/*.test.mjs tests/sdk/*.test.mjs tests/release/*.test.mjs
      - name: Relay tests
        run: node --test tests/relay/*.test.mjs
      - name: Version consistency
        run: node scripts/check-versions.mjs
      - name: Validate widgets
        # Fails if widgets/index.json or themes/index.json is stale: PR authors run `node scripts/catalog.mjs` and commit the result.
        run: node scripts/catalog.mjs --check

  linux:
    # The platform-neutral part (Umbra.Core, umbractl) and the Linux host (src/Umbra.Linux) must build and pass on Linux (#172).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Native build tools
        # src/Umbra.Linux compiles its sandbox web-process extension (native/umbra-webext.c) with gcc against WebKitGTK 6.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc pkg-config libwebkitgtk-6.0-dev
      - name: Build
        run: dotnet build Umbra.Linux.slnf -c Release -warnaserror
      - name: Unit tests
        run: dotnet test Umbra.Linux.slnf -c Release --no-build --logger "console;verbosity=normal"
      - name: Headless harness tools
        run: sudo apt-get install -y --no-install-recommends xvfb xauth openbox dbus dbus-x11 python3 xdotool bubblewrap fonts-dejavu-core
      - name: Let bubblewrap create user namespaces (runner only)
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, so WebKit's bubblewrap sandbox can't start a
        # web process. This throwaway runner allows them, so WebKit runs sandboxed as on a desktop (ci.sh switches WebKit's
        # sandbox off only inside a container, which is where scripts/ci-local.ps1 runs this job).
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Debug build for the harness
        # UMBRA_RELEASE_URL (the local release feed) is a Debug-only hook; only the two apps the harness starts.
        run: dotnet build src/Umbra.Linux -warnaserror && dotnet build src/Umbra.Cli -warnaserror
      - name: Headless smoke, sandbox and catalog (#198)
        # smoke.sh under Xvfb + openbox, the hostile-widget sandbox suite, every catalog widget; the Wayland path
        # (gnome.sh) runs only where gnome-shell is installed and is optional. scripts/ci-local.ps1 runs this in Docker.
        timeout-minutes: 45
        run: linux/test/ci.sh --no-build linux-out
      - name: Upload captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-linux
          path: linux-out
          if-no-files-found: ignore

  smoke:
    # End to end: start the real app with a throwaway data folder and drive it with umbractl (scripts/smoke.ps1).
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Umbra.slnx -c Release -warnaserror
      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke.ps1 -Configuration Release -OutDir smoke-out
      - name: Upload captures and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: smoke-out
          if-no-files-found: ignore
