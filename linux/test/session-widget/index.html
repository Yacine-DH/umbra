<!doctype html>
<html><head><meta charset="utf-8"><script src="https://umbra.local/shared/umbra.js"></script></head>
<body style="background:#000;color:#fff;font:14px sans-serif"><p>session test</p>
<script>
  const record = () => umbra.store.set("seen", { accent: umbra.settings.accent, paused: !!umbra.settings.paused,
    energySaver: !!umbra.settings.energySaver, refresh: umbra.settings.refreshSeconds });
  umbra.onSettings(record);
  setTimeout(record, 500);
</script></body></html>
