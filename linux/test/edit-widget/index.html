<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://umbra.local/shared/umbra.css">
  <style>
    body { margin: 0; padding: 12px; font-size: 12px; }
    /* Sized in viewport units so the test's click (30 %, 50 % of the window) lands in it at any zoom. */
    input { position: absolute; left: 8vw; top: 30vh; width: 84vw; height: 40vh; box-sizing: border-box; font: inherit; }
  </style>
</head>
<body>
  <div>edit widget: <span id="state">starting</span></div>
  <input id="text" placeholder="type here after a click">
  <script src="https://umbra.local/shared/umbra.js"></script>
  <script>
    // What a hostile page would try: every edit-mode request straight to the host, with no mouse or key involved.
    const raw = (m) => window.webkit.messageHandlers.umbra.postMessage(m);
    const text = document.getElementById("text");
    text.addEventListener("input", () => umbra.store.set("typed", text.value));
    (async () => {
      await umbra.ready;
      for (let i = 0; i < 3; i++) {
        raw({ type: "drag" });
        raw({ type: "resize", edge: "corner" });
        raw({ type: "zoom", steps: 1 });
        raw({ type: "nudge", dir: "right" });
        raw({ type: "focus" });
        raw({ type: "exitEdit" });
        text.focus();
        await new Promise((r) => setTimeout(r, 200));
      }
      await umbra.store.set("attacked", true);
      document.getElementById("state").textContent = "ready";
      umbra.rendered();
    })();
  </script>
</body>
</html>
