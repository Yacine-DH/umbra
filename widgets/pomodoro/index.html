<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pomodoro</title>
  <link rel="stylesheet" href="https://umbra.local/shared/umbra.css">
  <link rel="stylesheet" href="pomodoro.css">
  <link rel="stylesheet" href="timelapse.css">
</head>
<body>
  <main class="pm" id="app">
    <!-- Setup: pick the session length, whether it has breaks and whether to record a timelapse -->
    <section class="view setup" id="setup">
      <header class="head">
        <span class="title">Focus session</span>
        <span class="today"><b class="num" id="today">0m</b> today</span>
      </header>
      <div class="pick">
        <div class="stepper" data-no-drag>
          <button class="step" id="minus" aria-label="5 minutes less">&minus;</button>
          <label class="mins">
            <input class="num" id="minutes" type="number" min="5" max="600" step="5" aria-label="Session minutes">
            <span>mins</span>
          </label>
          <button class="step" id="plus" aria-label="5 minutes more">+</button>
        </div>
      </div>
      <div class="card" data-no-drag>
        <label class="switch">
          <span class="switch-text"><span>Skip breaks</span><small id="breaks-hint">You'll have no breaks</small></span>
          <input type="checkbox" id="skip-breaks" checked>
          <span class="knob" aria-hidden="true"></span>
        </label>
      </div>
      <div class="card tl" data-no-drag>
        <label class="switch">
          <span class="switch-text"><span>Timelapse</span><small class="num" id="tl-sum">Off</small></span>
          <input type="checkbox" id="tl-on">
          <span class="knob" aria-hidden="true"></span>
        </label>
        <div class="tl-body" id="tl-fields">
          <div class="tl-row">
            <span>1 photo every</span>
            <span class="tl-step">
              <button type="button" id="tl-prev" aria-label="Shorter gap between photos">&lsaquo;</button>
              <b class="num" id="tl-interval" aria-live="polite">30 s</b>
              <button type="button" id="tl-next" aria-label="Longer gap between photos">&rsaquo;</button>
            </span>
          </div>
          <div class="tl-row"><span>Save to</span><button type="button" class="link" id="tl-folder">Videos</button></div>
        </div>
      </div>
      <p class="tl-msg" id="setup-msg" hidden></p>
      <button class="btn primary wide" id="start" data-no-drag>Start focus session</button>
    </section>

    <!-- Run: ring, phase, up next, the round controls and the timelapse status -->
    <section class="view run" id="run" hidden>
      <header class="head">
        <span class="title num" id="phase">Focus period 1 of 1</span>
      </header>
      <div class="dial">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <g id="ticks"></g>
          <circle class="track" cx="60" cy="60" r="54"/>
          <circle class="arc" id="arc" cx="60" cy="60" r="54"/>
        </svg>
        <div class="center">
          <div class="time num" id="time">00:00</div>
          <div class="sub" id="sub">min left</div>
        </div>
      </div>
      <p class="next num" id="next">Up next: 5 min break</p>
      <div class="ctl" data-no-drag>
        <button class="round off" id="reset" aria-label="Reset session" title="Reset session">
          <svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9L4 8.5"/><path d="M4 4v4.5h4.5"/></svg>
        </button>
        <button class="round primary" id="toggle" aria-label="Pause" title="Pause">
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.6v12.8a1 1 0 0 0 1.5.86l10.6-6.4a1 1 0 0 0 0-1.72L10 4.74a1 1 0 0 0-1.5.86z"/></svg>
        </button>
        <div class="more-wrap">
          <button class="round" id="more" aria-label="More" title="More" aria-haspopup="menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg>
          </button>
          <div class="menu" id="menu" role="menu" hidden>
            <button role="menuitem" id="m-skip">Skip break</button>
            <button role="menuitem" id="m-add">Add 5 minutes</button>
            <button role="menuitem" id="m-end" class="danger">End session</button>
          </div>
        </div>
      </div>
      <!-- Moves to the setup view when a session ends while its video is still being made (renderTl) -->
      <div class="tl-run" id="tl-run" data-no-drag hidden>
        <span class="tl-mark" aria-hidden="true"></span>
        <span class="tl-stat num" id="tl-stat"></span>
        <button class="link" id="tl-act"></button>
      </div>
    </section>
  </main>
  <script src="https://umbra.local/shared/umbra.js"></script>
  <script src="session.js"></script>
  <script src="timelapse.js"></script>
  <script src="pomodoro.js"></script>
</body>
</html>
