<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Now Playing</title>
  <link rel="stylesheet" href="https://umbra.local/shared/umbra.css">
  <style>
    html, body { height: 100%; overflow: hidden; background: var(--bg); }
    .np { height: 100%; display: flex; align-items: center; gap: 14px; padding: 0 16px; }
    .art {
      width: 88px; height: 88px; flex: none; border-radius: 10px; background: var(--surface-1) center / cover no-repeat;
      border: 1px solid var(--line, rgba(255,255,255,.08)); display: grid; place-items: center; color: var(--text-3);
    }
    .art svg { width: 30px; height: 30px; }
    .art.has svg { display: none; }
    .info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .app { font-size: 11px; font-weight: 500; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title { font-family: var(--font-display); font-size: 16px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctl { display: flex; align-items: center; gap: 4px; margin-top: 6px; margin-left: -6px; }
    .ctl button {
      width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; color: var(--text-2);
      display: grid; place-items: center; cursor: pointer;
    }
    .ctl button:hover:not(:disabled) { background: var(--accent-soft, rgba(255,255,255,.08)); color: var(--text, #fff); }
    .ctl button:disabled { opacity: .3; cursor: default; }
    .ctl button.main { background: var(--accent); color: #000; width: 36px; height: 36px; }
    .ctl button.main:hover:not(:disabled) { background: var(--accent-strong, var(--accent)); color: #000; }
    .ctl svg { width: 16px; height: 16px; fill: currentColor; }
    .empty { margin: auto; text-align: center; color: var(--text-3); font-size: 12px; }
    .empty b { display: block; color: var(--text-2); font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="np">
    <div id="empty" class="empty" hidden><b>Nothing playing</b>Start music or a video in any app.</div>
    <div class="art" id="art"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></div>
    <div class="info" id="info">
      <div class="app" id="app"></div>
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
      <div class="ctl" id="ctl">
        <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
        <button id="toggle" class="main" aria-label="Play or pause"><svg id="ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
    </div>
  </main>

  <script src="https://umbra.local/shared/umbra.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const PLAY = "M8 5v14l11-7z", PAUSE = "M6 5h4v14H6zm8 0h4v14h-4z";
    let last = null, first = true;

    function render(s) {
      last = s;
      const o = umbra.options;
      $("empty").hidden = !!s;
      $("art").hidden = !s || o.art === false;
      $("info").hidden = !s;
      if (!s) return;
      $("title").textContent = s.title || "Unknown title";
      $("artist").textContent = [s.artist, s.album].filter(Boolean).join(" · ");
      $("app").textContent = s.app || "";
      $("app").hidden = o.showApp === false || !s.app;
      $("art").classList.toggle("has", !!s.art);
      $("art").style.backgroundImage = s.art ? `url("${s.art}")` : "";
      $("ctl").hidden = o.controls === false;
      $("prev").disabled = !s.canPrevious;
      $("next").disabled = !s.canNext;
      $("toggle").disabled = !(s.canPlay || s.canPause);
      $("ico").firstElementChild.setAttribute("d", s.playing ? PAUSE : PLAY);
    }

    async function poll() {
      try { render(await umbra.media.nowPlaying()); } catch { render(null); }
      if (first) { first = false; umbra.rendered(); }
    }

    async function send(cmd) {
      try { await umbra.media.control(cmd); } catch {}
      setTimeout(poll, 250);
    }
    $("prev").onclick = () => send("previous");
    $("next").onclick = () => send("next");
    $("toggle").onclick = () => send("toggle");

    umbra.ready.then(() => { poll(); setInterval(poll, 2000); });
    umbra.onSettings(() => render(last));
  </script>
</body>
</html>
